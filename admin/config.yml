# ============================================================
#  관리자 모드(Decap CMS) 설정
#  ⚠️ 아래 repo 값만 본인 GitHub 저장소로 바꾸면 됩니다.
#     예) repo: honggildong/lk-vending
# ============================================================
backend:
  name: github
  repo: repo: byul0204-design/banding
  branch: main
  commit_messages:
    create: "글 작성: {{slug}}"
    update: "글 수정: {{slug}}"
    delete: "글 삭제: {{slug}}"
    uploadMedia: "이미지 업로드: {{path}}"
    deleteMedia: "이미지 삭제: {{path}}"

# 내 컴퓨터에서 테스트할 때만 쓰입니다 (npx decap-server). 실제 사이트에는 영향 없음.
local_backend: true

locale: ko

site_url: /
display_url: /
logo_url: /assets/img/apple-touch-icon.png

# 업로드한 이미지가 저장되는 곳
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  # ---------------- 블로그 글 ----------------
  - name: posts
    label: 블로그 글
    label_singular: 글
    description: 글을 저장하면 1~2분 뒤 사이트에 자동으로 발행돼요. 발행 전에 숨기고 싶으면 '임시저장'을 켜세요.
    folder: content/posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{title}}  ({{date | date('YYYY.MM.DD')}})"
    sortable_fields: ["date", "title"]
    view_filters:
      - label: 임시저장 글만
        field: draft
        pattern: true
    view_groups:
      - label: 카테고리
        field: category
    fields:
      - label: 제목
        name: title
        widget: string
        hint: 검색 결과에 그대로 보여요. 핵심 단어를 앞쪽에 넣으면 좋아요. (예. 학원 자판기 설치 후기)

      - label: 글 주소(영문)
        name: slug
        widget: string
        required: false
        pattern: ['^[a-z0-9-]*$', '영문 소문자, 숫자, 하이픈(-)만 쓸 수 있어요.']
        hint: "사이트주소/blog/여기에-쓴-값/ 으로 발행돼요. 예) academy-vending-machine · 비워 두면 날짜로 자동 생성돼요. 발행 후에는 바꾸지 않는 것이 좋아요."

      - label: 발행일
        name: date
        widget: datetime

      - label: 카테고리
        name: category
        widget: select
        default: product
        options:
          - { label: 제품 소개, value: product }
          - { label: 설치 사례, value: cases }
          - { label: 창업·운영 정보, value: startup }
          - { label: 공지사항, value: notice }

      - label: 대표 이미지
        name: thumbnail
        widget: image
        required: false
        hint: 블로그 목록과 카카오톡·네이버 공유 미리보기에 쓰여요. 가로 1200px 정도의 가로형 JPG 사진을 권장해요.

      - label: 요약 설명
        name: description
        widget: text
        required: false
        hint: 검색 결과 제목 아래에 보이는 설명이에요. 80~150자 권장. 비워 두면 본문 앞부분이 자동으로 들어가요.

      - label: 태그
        name: tags
        widget: list
        required: false
        hint: 쉼표(,)로 구분해서 입력하세요. 예) 무인카페, 음료 자판기

      - label: 임시저장 (사이트에 공개하지 않음)
        name: draft
        widget: boolean
        default: false
        required: false

      - label: 본문
        name: body
        widget: markdown
        hint: 사진은 본문 편집기의 + 버튼 > 이미지 로 넣을 수 있어요. 소제목(제목2)을 쓰면 읽기 쉬워지고 검색에도 유리해요.

  # ---------------- 사이트 설정 ----------------
  - name: settings
    label: 사이트 설정
    editor:
      preview: false
    files:
      - name: site
        label: 기본 정보 · 네이버 연동
        file: data/settings.json
        fields:
          - label: 사이트 이름
            name: siteName
            widget: string

          - label: 사이트 주소
            name: siteUrl
            widget: string
            required: false
            hint: "도메인을 연결했다면 https://로 시작하는 주소를 넣으세요 (끝에 / 없이). 비워 두면 Netlify 기본 주소를 자동으로 씁니다."

          - label: 상담 전화번호
            name: phone
            widget: string
            hint: 사이트의 모든 전화 버튼이 이 번호로 바뀌어요. 예) 010-7773-2425

          - label: 상담 가능 시간
            name: hours
            widget: string
            required: false
            hint: 예) 평일 09:00~18:00 (주말·공휴일 휴무). 비워 두면 표시하지 않아요.

          - label: 네이버 사이트 인증 코드
            name: naverVerification
            widget: string
            required: false
            hint: "네이버 서치어드바이저 > 소유확인 > HTML 태그에서 content=\"...\" 따옴표 안의 값만 붙여 넣으세요."

          - label: 구글 사이트 인증 코드 (선택)
            name: googleVerification
            widget: string
            required: false
            hint: "Google Search Console > HTML 태그의 content 값만 붙여 넣으세요."

          - label: 사업자 정보 (사이트 하단에 표시)
            name: company
            widget: object
            collapsed: false
            fields:
              - { label: 상호, name: name, widget: string, required: false }
              - { label: 대표자, name: ceo, widget: string, required: false }
              - { label: 사업자등록번호, name: bizNumber, widget: string, required: false }
              - { label: 주소, name: address, widget: string, required: false }
              - { label: 이메일, name: email, widget: string, required: false }
